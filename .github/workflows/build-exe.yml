name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller flask

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --name "Scanner-IP-CDN" scanner.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scanner-IP-CDN-Windows
          path: dist/Scanner-IP-CDN.exe
          
